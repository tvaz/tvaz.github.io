<div class="gallery-container">
    <div class="desc">
        here is a selection of some of my illustrations.
    </div>
    <div class="gallery">
    {% for image in site.data.gallery %}
        <a href="#{{ image.filename }}" title="{{ image.filename }}">
            <img src="{{ 'images/gallery/' | append: image.filename | relative_url }}" title="{{ image.title }}" alt="{{ image.description }}" class="thumbnail"/>
        </a>
    {% endfor %}
    </div>
    <!-- Lightbox overlays-->
    {% for image in site.data.gallery %}
    {% assign filename = image.filename | split: "." | first %}
    <div id="{{ image.filename }}" class="lightbox">
        <a href="#" class="close">&times;</a>
        <span class="arrow left">&#10094;</span>
        <img class="lightbox-image" src="{{ 'images/gallery/' | append: image.filename | relative_url }}" alt="{{ image.filename }}">
        <div class="lightbox-details">
            <div class="caption">{{ image.title }}</div>
            <div class="date">{{ image.date | date: "%B %d, %Y" }}</div>
            <div class="description">{{ image.description }}</div>
        </div>
        <span class="arrow right">&#10095;</span>
    </div>
    {% endfor %}
</div>
<script>
    {% include image-gallery.js %}
</script>
